<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Dose</title>
    <meta name="description" content="Personal peptide & supplement dosing tracker" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dose" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <meta name="theme-color" content="#0A0908" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind, compiled live in the browser - no build step. Fine for a
         personal daily-use app; the tradeoff is a tiny bit of one-time work
         each page load instead of at deploy time. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: { DEFAULT: '#0A0908', soft: '#161311', raised: '#201B17', line: '#332B24' },
              paper: { DEFAULT: '#F4EFE9', dim: '#A69B8F', faint: '#6E6459' },
              amber: { DEFAULT: '#F2760E', soft: '#3D2410', bright: '#FF8F2E' },
              teal: { DEFAULT: '#C25A0F', soft: '#331C0C', bright: '#DD7420' },
              coral: { DEFAULT: '#E5432C', soft: '#3A1913' },
            },
            fontFamily: {
              display: ['Sora', 'system-ui', 'sans-serif'],
              body: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              card: '0 1px 0 0 rgba(255,255,255,0.03) inset, 0 8px 24px -12px rgba(0,0,0,0.6)',
            },
            borderRadius: {
              xl2: '1.25rem',
            },
          },
        },
      };
    </script>

    <style>
      html, body, #root { height: 100%; }
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .font-mono { font-variant-numeric: tabular-nums; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #332B24; border-radius: 999px; }

      .input {
        width: 100%;
        background-color: #161311;
        border: 1px solid #332B24;
        border-radius: 0.5rem;
        padding: 0.625rem 0.875rem;
        font-size: 0.875rem;
        outline: none;
      }
      .input:focus { border-color: #F2760E; }
      .input::placeholder { color: #6E6459; }

      @keyframes slideup {
        from { transform: translateY(16px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>

    <!-- React, loaded the classic no-build-step way: plain global scripts. -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  </head>
  <body class="bg-ink text-paper font-body">
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
